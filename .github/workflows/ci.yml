name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/go/src

    services:
      # globalsign/mgo is a 2018 fork and cannot complete server selection
      # against MongoDB 6.0 or newer, so the integration test in test/ only
      # passes against 5.0 or older. Bump this once the driver moves to
      # go.mongodb.org/mongo-driver.
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go/src/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  client:
    name: React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Reported, not enforced. npm audit currently finds 67 advisories, nearly
      # all of them transitive through react-scripts, which pins the vulnerable
      # versions and is unmaintained. Make this a blocking step once the Vite
      # migration lands and the count is something we can hold at zero.
      - name: Audit
        continue-on-error: true
        run: npm audit
