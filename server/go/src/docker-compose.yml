version: "3.9"
services:
  editor-server:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Where the client mount lands below. The server skips serving a client
      # entirely if there is no index.html there, so an unbuilt client leaves
      # the API working on its own.
      CLIENT_DIR: /go/src/client
    volumes:
      - ./.env:/go/src/.env:Z
      # Built on the host by `npm run build`, mounted rather than baked into the
      # image: the build context here is server/go/src, so the Dockerfile cannot
      # reach client/ to build it itself. Read-only because the server only ever
      # serves these.
      - ../../../client/build:/go/src/client:ro,Z
  mongo:
    image: "mongo"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ~/trivdata:/data/db:Z
